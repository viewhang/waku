[package]
name = "waku-core"
version = "0.1.0"
edition = "2024"
description = "Headless provider, persistence, and workspace runtime for Waku"
license = "GPL-3.0-only"
readme = "README.md"

[dependencies]
agent-client-protocol = "2.0.0"
alacritty_terminal = { version = "0.26", default-features = false }
anyhow = "1.0"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
dirs = "6.0"
dom_query = "0.28"
cap-std = "4"
quick-xml = "0.39"
pulldown-cmark = "0.13"
eventsource-stream = "0.2"
image = { version = "0.25", default-features = false, features = ["bmp", "png", "tiff"] }
nucleo-matcher = "0.3"
notify = "8.2"
parking_lot = "0.12"
rust-i18n = "4"
rig = { package = "rig-core", version = "=0.37.0", default-features = false, features = ["reqwest", "rustls"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "multipart", "rustls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = { version = "0.0.29", default-features = false, features = ["deserialize", "serialize"] }
serde_json = "1.0"
sha2 = "0.10"
smol = "2"
subtle = "2"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
toml = "0.8"
trash = "5.2.6"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
url = "2"
uuid = { version = "1.18", features = ["v4", "serde"] }
waku-protocol = { path = "../waku-protocol" }

[target.'cfg(any(target_vendor = "apple", target_os = "linux"))'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSLocale",
    "NSString",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
waku-client = { path = "../waku-client" }
